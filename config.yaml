# Wildfire spread risk model: Central Otago + Queenstown Lakes
# All distances in metres (NZTM2000, EPSG:2193) unless stated.

districts:
  - Central Otago District
  - Queenstown-Lakes District
buffer_m: 5000          # analysis rectangle = district bounds + this buffer
cell_m: 25

kmz: kml.kmz

layers:
  lcdb:          {host: lris.scinfo.org.nz,  key: LRIS_API_KEY, id: 123148}
  buildings:     {host: data.linz.govt.nz,   key: LINZ_API_KEY, id: 101290}
  river_poly:    {host: data.linz.govt.nz,   key: LINZ_API_KEY, id: 50328}
  river_line:    {host: data.linz.govt.nz,   key: LINZ_API_KEY, id: 50327}
  lake_poly:     {host: data.linz.govt.nz,   key: LINZ_API_KEY, id: 50293}
  roads:         {host: data.linz.govt.nz,   key: LINZ_API_KEY, id: 50329}
  irrigated:     {host: data.mfe.govt.nz,    key: MFE_API_KEY,  id: 105407, optional: true}

dem_url: "https://nz-elevation.s3.ap-southeast-2.amazonaws.com/new-zealand/new-zealand-contour/dem_8m/2193"
lidar_dem_url: "https://nz-elevation.s3.ap-southeast-2.amazonaws.com/new-zealand/new-zealand/dem_1m/2193"
lidar_dsm_url: "https://nz-elevation.s3.ap-southeast-2.amazonaws.com/new-zealand/new-zealand/dsm_1m/2193"

lidar:                    # vegetation height = LiDAR surface minus ground, averaged per cell
  scrub_min_m: 1.0        # grass or tussock cells at least this tall are treated as scrub
  tree_min_m: 5.0         # ... and at least this tall as conifer trees

satellite:                # Sentinel-2 summer greenness sets how cured pasture is
  years: [2025, 2026]
  season: ["01-01", "03-15"]
  max_cloud_pct: 30
  scenes_per_tile: 8
  ndvi_percentile: 25     # 25 = the drier end of what was observed; 50 = typical summer
  ndvi_cured: 0.25        # NDVI at or below this = 100% cured
  ndvi_green: 0.75        # NDVI at or above this = 50% cured (will not carry fire)

pcl_url: "https://services1.arcgis.com/3JjYDyG3oajxU6HO/ArcGIS/rest/services/DOC_Public_Conservation_Land/FeatureServer/0"

weather:
  start_year: 2005        # seasons Nov (year) to Mar (year+1)
  end_year: 2024
  grid_points: [4, 3]     # columns x rows of sample points across the area
  afternoon_local_hours: [12, 18]
  min_temp_c: 20          # "hot, dry" filter applied to afternoon hours
  max_rh_pct: 35
  n_scenarios: 3
  wind_percentile: 95
  # ERA5 is a ~25 km average and reads low against valley and ridge stations.
  # Raise this to stress-test with stronger wind (1.0 = use ERA5 as is).
  # 2.0 gives about 35-40 km/h sustained wind: the strong-wind days on which
  # line faults are most likely.
  speed_scale: 2.0

wind_exposure:
  reach_m: 2000           # how far upwind to look for sheltering terrain
  step_m: 100
  # horizon angle upwind (degrees) -> wind speed multiplier
  angle_deg: [-10, 0, 20]
  multiplier: [1.3, 1.0, 0.5]

spread:
  max_slope_pct: 70       # slope factor capped here (x10)
  stream_factor: 0.7      # rate-of-spread multiplier in cells crossed by a stream
  road_factor: 0.6        # ... by a sealed road
  irrigated_curing_pct: 55

simulation:
  burn_hours: 6
  ignition_spacing_m: 500
  section_max_m: 1000     # longer lines are cut into sections of at most this length
  building_reach_m: 50    # buildings this close to burnable ground count as exposed
  threads: 8

response:                 # how soon the first fire crew could reach an ignition
  turnout_min: 8          # call-out to wheels rolling (volunteer brigades)
  speed_kmh: {sealed: 70, metalled: 40, unmetalled: 25, off_road: 4}
  max_min: 240

priority:                 # single patrol-priority score per line section, 0-100
  weights:                # must sum to 1
    property: 0.40        # buildings a fire would reach
    conservation: 0.25    # conservation land burned
    response: 0.25        # how big the fire is when the first crew arrives
    spread: 0.10          # total area burned
  commercial_multiplier: 3    # a building in a business area counts this many times
  # share of line length in each band, highest priority first; rest is "Low"
  bands: {Very high: 0.10, High: 0.20, Medium: 0.30}

export:
  min_zoom: 7
  max_zoom: 12
